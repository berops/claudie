apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansibler
  labels:
    app.kubernetes.io/part-of: claudie
    app.kubernetes.io/name: ansibler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: claudie
      app.kubernetes.io/name: ansibler
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: claudie
        app.kubernetes.io/name: ansibler
    spec:
      terminationGracePeriodSeconds: 1320
      securityContext:
        runAsUser: 65534
        runAsGroup: 3000
        fsGroup: 2000
      volumes:
        - name: data
          emptyDir: {}
        - name: temp
          emptyDir: {}
      containers:
        - name: ansibler
          volumeMounts:
            - mountPath: /bin/services/ansibler/clusters
              name: data
            - mountPath: /.ansible
              name: temp
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - all
          imagePullPolicy: Always
          image: ghcr.io/berops/claudie/ansibler
          resources:
            requests:
              cpu: 200m
              memory: 1000Mi
            limits:
              memory: 2250Mi
          env:
            - name: ANSIBLER_CONCURRENT_CLUSTERS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: ANSIBLER_CONCURRENT_CLUSTERS
            - name: ANSIBLER_FORKS
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: ANSIBLER_FORKS
            - name: ANSIBLER_PORT
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: ANSIBLER_PORT
              # No hostname needed
            - name: GOLANG_LOG
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: GOLANG_LOG
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NATS_CLUSTER_URL
              value: "nats://nats.$(NAMESPACE).svc.cluster.local"
            - name: NATS_CLUSTER_SIZE
              valueFrom:
                configMapKeyRef:
                  name: env
                  key: NATS_CLUSTER_SIZE
            - name: ANSIBLE_PIPELINING
              value: "True"
            - name: ANSIBLE_STRATEGY
              value: "mitogen_linear"
            # TMPDIR is needed as Mitogen creates its unix sockets there and the root filesystem (/tmp) is read-only.
            - name: TMPDIR
              value: "/.ansible"
            # Must stay above the 20 minutes becasue "unattended-upgrade-shutdown --delay 20" may wait for a running upgrade
            - name: ANSIBLE_TASK_TIMEOUT
              value: "1500"
            # Connection timeout, also used by Mitogen as its connect/bootstrap deadline. The default 10s is too short
            # when many hosts bootstrap at once through a single Mitogen multiplexer.
            - name: ANSIBLE_TIMEOUT
              value: "60"
            # Skip python interpreter discovery, all supported images are Ubuntu where python3 is always /usr/bin/python3
            # It can save ~5 seconds on each playbook
            - name: ANSIBLE_PYTHON_INTERPRETER
              value: "/usr/bin/python3"
          ports:
            - containerPort: 50053
            - name: "metrics"
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 50053
              service: ansibler-readiness
            initialDelaySeconds: 30
            periodSeconds: 35
          livenessProbe:
            grpc:
              port: 50053
              service: ansibler-liveness
            initialDelaySeconds: 30
            periodSeconds: 35
---
kind: Service
apiVersion: v1
metadata:
  name: ansibler
  labels:
    app.kubernetes.io/part-of: claudie
    app.kubernetes.io/name: ansibler
spec:
  selector:
    app.kubernetes.io/part-of: claudie
    app.kubernetes.io/name: ansibler
  ports:
    - protocol: TCP
      port: 50053
      targetPort: 50053
