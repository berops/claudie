name: Build image
description: >-
  Builds the image of one Claudie service and pushes it to ghcr.io.
  Call it once per service from a matrix job. The repository must be checked out first,
  and the job needs the packages write permission.

inputs:
  service:
    description: Service to build, a folder under services/ with a Dockerfile.
    required: true
  tag:
    description: Image tag, for example a commit SHA or a release version.
    required: true
  platforms:
    description: Comma-separated target platforms.
    default: linux/amd64
  token:
    description: Token used to push to ghcr.io.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Emulation is only needed for platforms other than the runner's own.
    - if: inputs.platforms != 'linux/amd64'
      uses: docker/setup-qemu-action@v4

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/build-push-action@v7
      with:
        context: .
        file: services/${{ inputs.service }}/Dockerfile
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ inputs.tag }}
        # One cache scope per service, so parallel builds don't overwrite each other.
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,scope=${{ inputs.service }},mode=max
