apiVersion: claudie.io/v1beta1
kind: InputManifest
metadata:
  name: destroy-cluster
spec:
  providers:
    - name: hetzner-1
      providerType: hetzner
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: hetzner-secret
        namespace: e2e-secrets
  nodePools:
    static:
      - name: static-nodes
        nodes:
          - endpoint: replace-me
            secretRef:
              name: static-nodes-key
              namespace: e2e-secrets
    dynamic:
      - name: htz-ctrl-nodes
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04
        storageDiskSize: 50

      - name: htz-cmpt-nodes
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04
        storageDiskSize: 50

  kubernetes:
    clusters:
      - name: destroy-cluster-test-cluster
        version: "1.36.0"
        network: 192.168.2.0/24
        pools:
          control:
            - htz-ctrl-nodes
          compute:
            - htz-cmpt-nodes
            - static-nodes
