apiVersion: claudie.io/v1beta1
kind: InputManifest
metadata:
  name: api-endpoint-moves
spec:
  providers:
    - name: hetzner-1
      providerType: hetzner
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: hetzner-secret
        namespace: e2e-secrets
  nodePools:
    dynamic:
      - name: htz-ctrl-a
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04
      - name: htz-ctrl-b
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04
      - name: htz-cmpt-nodes
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 2
        serverType: cpx22
        image: ubuntu-24.04
        storageDiskSize: 50

  kubernetes:
    clusters:
      - name: api-endpoint-moves-cluster
        version: "1.36.0"
        network: 192.168.2.0/24
        installationProxy:
          mode: "on"
        pools:
          control:
            - htz-ctrl-a
            - htz-ctrl-b
          compute:
            - htz-cmpt-nodes
