# Cluster architecture
#
# One Kubernetes cluster "conformance-test-cluster" spanning all 7 provider types.
# Kubernetes 1.36.0, network 192.168.2.0/24, installation proxy "on".
# Every provider except Exoscale contributes one control plane node and one compute node.
# A Hetzner load balancer "conformance-apiserver-lb" fronts all control plane nodes on 6443,
# with an A record created in the claudie.org zone via hetzner-1.
#
# | Role    | Node pool      | Provider (name)             | Region / zone                 | Nodes | Server type     | Disk | Taint                |
# |---------|----------------|-----------------------------|-------------------------------|-------|-----------------|------|----------------------|
# | control | htz-ctrl-nodes | hetzner   (hetzner-1)       | nbg1 / nbg1-dc3               | 1     | cpx22           | -    | -                    |
# | control | gcp-ctrl-nodes | gcp       (gcp-1)           | europe-west2 / europe-west2-c | 1     | e2-medium       | -    | -                    |
# | control | oci-ctrl-nodes | oci       (oci-1)           | eu-frankfurt-1 / AD-1         | 1     | VM.Standard2.1  | -    | test:NoSchedule      |
# | control | aws-ctrl-nodes | aws       (aws-1)           | eu-north-1 / eu-north-1a      | 1     | t3.medium       | -    | test=test:NoSchedule |
# | control | azr-ctrl-nodes | azure     (azure-sponsor-2) | Germany West Central / 1      | 1     | Standard_B2s    | -    | test=test:NoSchedule |
# | control | ovh-ctrl-nodes | openstack (ovh-1)           | DE1 / nova                    | 1     | c3-4-flex       | -    | test=test:NoSchedule |
# | compute | htz-cmpt-nodes | hetzner   (hetzner-1)       | nbg1 / nbg1-dc3               | 1     | cpx22           | 50G  | -                    |
# | compute | gcp-cmpt-nodes | gcp       (gcp-1)           | europe-west1 / europe-west1-b | 1     | e2-standard-4   | 50G  | -                    |
# | compute | oci-cmpt-nodes | oci       (oci-1)           | eu-frankfurt-1 / AD-1         | 1     | VM.Standard1.2  | 50G  | -                    |
# | compute | aws-cmpt-nodes | aws       (aws-2)           | eu-west-3 / eu-west-3a        | 1     | t3.medium       | 50G  | -                    |
# | compute | azr-cmpt-nodes | azure     (azure-sponsor-1) | Germany West Central / 1      | 1     | Standard_B2s    | 50G  | -                    |
# | compute | exo-cmpt-nodes | exoscale  (exoscale-1)      | ch-gva-2                      | 1     | standard.medium | 50G  | -                    |
# | compute | ovh-cmpt-nodes | openstack (ovh-1)           | RBX-A / nova                  | 1     | c3-8-flex       | 50G  | -                    |
# | lb      | htz-lb-nodes   | hetzner   (hetzner-1)       | nbg1 / nbg1-dc3               | 1     | cpx22           | -    | -                    |
#
# Total: 14 nodes (6 control plane, 7 compute, 1 load balancer).
#
# Labels "test-set: conformance-test" are set on all Hetzner, GCP, Azure, Exoscale and OVH pools (not OCI, not AWS).
# Annotation "claudie.io/example-annotation" is set on all pools except gcp-ctrl-nodes, OCI and AWS pools.

apiVersion: claudie.io/v1beta1
kind: InputManifest
metadata:
  name: conformance
spec:
  providers:
    - name: gcp-1
      providerType: gcp
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: gcp-secret
        namespace: e2e-secrets
    - name: hetzner-1
      providerType: hetzner
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: hetzner-secret
        namespace: e2e-secrets
    - name: oci-1
      providerType: oci
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: oci-secret
        namespace: e2e-secrets
    - name: aws-1
      providerType: aws
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: aws-secret
        namespace: e2e-secrets
    - name: aws-2
      providerType: aws
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: aws-secret
        namespace: e2e-secrets
    - name: azure-sponsor-1
      providerType: azure
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: azure-sponsorship-secret
        namespace: e2e-secrets
    - name: azure-sponsor-2
      providerType: azure
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: azure-sponsorship-secret
        namespace: e2e-secrets
    - name: exoscale-1
      providerType: exoscale
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: exoscale-secret
        namespace: e2e-secrets
    - name: ovh-1
      providerType: openstack
      templatesRef:
        name: claudie-default-templates
      secretRef:
        name: ovh-secret
        namespace: e2e-secrets
  nodePools:
    dynamic:
      - name: htz-ctrl-nodes
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]
      - name: htz-cmpt-nodes
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04
        storageDiskSize: 50
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]
      - name: htz-lb-nodes
        providerSpec:
          name: hetzner-1
          region: nbg1
          zone: nbg1-dc3
        count: 1
        serverType: cpx22
        image: ubuntu-24.04

      - name: gcp-ctrl-nodes
        providerSpec:
          name: gcp-1
          region: europe-west2
          zone: europe-west2-c
        count: 1
        serverType: e2-medium
        image: ubuntu-2404-noble-amd64-v20251001
        labels:
          test-set: conformance-test
      - name: gcp-cmpt-nodes
        providerSpec:
          name: gcp-1
          region: europe-west1
          zone: europe-west1-b
        count: 1
        serverType: e2-standard-4
        image: ubuntu-2404-noble-amd64-v20251001
        storageDiskSize: 50
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]

      - name: oci-ctrl-nodes
        providerSpec:
          name: oci-1
          region: eu-frankfurt-1
          zone: hsVQ:EU-FRANKFURT-1-AD-1
        count: 1
        serverType: VM.Standard2.1
        # https://docs.oracle.com/en-us/iaas/images/ubuntu-2404/canonical-ubuntu-24-04-2024-08-28-0.htm
        image: ocid1.image.oc1.eu-frankfurt-1.aaaaaaaa7hxwyz4qiasffo7n7s4ep5lywpzwgkc2am65frqrqinoyitmxxla
        taints:
          - key: test
            effect: NoSchedule
      - name: oci-cmpt-nodes
        providerSpec:
          name: oci-1
          region: eu-frankfurt-1
          zone: hsVQ:EU-FRANKFURT-1-AD-1
        count: 1
        serverType: VM.Standard1.2
        # https://docs.oracle.com/en-us/iaas/images/ubuntu-2404/canonical-ubuntu-24-04-2024-08-28-0.htm
        image: ocid1.image.oc1.eu-frankfurt-1.aaaaaaaa7hxwyz4qiasffo7n7s4ep5lywpzwgkc2am65frqrqinoyitmxxla
        storageDiskSize: 50

      - name: aws-ctrl-nodes
        providerSpec:
          name: aws-1
          region: eu-north-1
          zone: eu-north-1a
        count: 1
        serverType: t3.medium
        #ubuntu
        image: ami-08eb150f611ca277f
        taints:
          - key: test
            value: test
            effect: NoSchedule
      - name: aws-cmpt-nodes
        providerSpec:
          name: aws-2
          region: eu-west-3
          zone: eu-west-3a
        count: 1
        serverType: t3.medium
        #ubuntu
        image: ami-045a8ab02aadf4f88
        storageDiskSize: 50

      - name: azr-ctrl-nodes
        providerSpec:
          name: azure-sponsor-2
          region: Germany West Central
          zone: "1"
        count: 1
        serverType: Standard_B2s
        image: Canonical:ubuntu-24_04-lts:server:24.04.202510010
        taints:
          - key: test
            value: test
            effect: NoSchedule
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]
      - name: azr-cmpt-nodes
        providerSpec:
          name: azure-sponsor-1
          region: Germany West Central
          zone: "1"
        count: 1
        serverType: Standard_B2s
        image: Canonical:ubuntu-24_04-lts:server:24.04.202510010
        storageDiskSize: 50
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]
      - name: exo-cmpt-nodes
        providerSpec:
          name: exoscale-1
          region: ch-gva-2
        count: 1
        serverType: standard.medium
        image: "Linux Ubuntu 24.04 LTS 64-bit"
        storageDiskSize: 50
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]

      - name: ovh-ctrl-nodes
        providerSpec:
          name: ovh-1
          region: DE1
          zone: nova
          externalNetworkName: Ext-Net
        count: 1
        serverType: c3-4-flex
        image: "Ubuntu 24.04"
        taints:
          - key: test
            value: test
            effect: NoSchedule
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]
      - name: ovh-cmpt-nodes
        providerSpec:
          name: ovh-1
          region: RBX-A
          zone: nova
          externalNetworkName: Ext-Net
        count: 1
        serverType: c3-8-flex
        image: "Ubuntu 24.04"
        storageDiskSize: 50
        labels:
          test-set: conformance-test
        annotations:
          claudie.io/example-annotation: >
            ["conformance-test"]
  kubernetes:
    clusters:
      - name: conformance-test-cluster
        version: "1.36.0"
        network: 192.168.2.0/24
        installationProxy:
          mode: "on"
        pools:
          control:
            - htz-ctrl-nodes
            - gcp-ctrl-nodes
            - oci-ctrl-nodes
            - aws-ctrl-nodes
            - azr-ctrl-nodes
            - ovh-ctrl-nodes
          compute:
            - htz-cmpt-nodes
            - gcp-cmpt-nodes
            - oci-cmpt-nodes
            - aws-cmpt-nodes
            - azr-cmpt-nodes
            - exo-cmpt-nodes
            - ovh-cmpt-nodes
  loadBalancers:
    roles:
      - name: apiserver
        protocol: tcp
        port: 6443
        targetPort: 6443
        targetPools:
          - htz-ctrl-nodes
          - gcp-ctrl-nodes
          - oci-ctrl-nodes
          - aws-ctrl-nodes
          - azr-ctrl-nodes
          - ovh-ctrl-nodes
    clusters:
      - name: conformance-apiserver-lb
        roles:
          - apiserver
        dns:
          dnsZone: claudie.org
          provider: hetzner-1
        targetedK8s: conformance-test-cluster
        pools:
          - htz-lb-nodes
