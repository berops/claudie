---
# Writes the default containerd configuration with the systemd cgroup driver, in one write so the
# file only changes when the default of the installed containerd changes.

- name: Render the default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_config_default_command
  changed_when: false

# kubeadm configures the kubelet with the systemd cgroup driver, the runtime must match.
- name: Write the default containerd configuration
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_config_default_command.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
    mode: "0644"
