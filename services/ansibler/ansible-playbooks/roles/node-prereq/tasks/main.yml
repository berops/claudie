---
# Puts a node of the kubernetes cluster into the state Claudie needs: the Longhorn dependencies,
# raised node limits, no swap, kernel networking for pods, and on nodes that are not part of a
# cluster yet also the pinned containerd and Kubernetes packages, with containerd configured
# for kubeadm. Validation is left to the kubeadm preflight checks.
#
# The package installation is the slowest part. It runs in the background while the rest of the
# node is configured and is waited for before the packages are used.

# Nodes that already joined a cluster (kubeadm or kubeone built) keep their packages, apt
# repositories and containerd configuration: the role also runs on every infrastructure refresh,
# and the packages are held, so installing a pinned version during an upgrade would fail.
# kubeadm writes kubelet.conf when a node joins, a node whose init or join failed is reset by the
# kubeadm roles, so a node that is retried without it gets the full setup again.
- name: Check whether the node already joined a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Add the Kubernetes and Docker apt repositories
  ansible.builtin.import_tasks: add-apt-repositories.yml
  when: not kubelet_conf.stat.exists

- name: Start installing packages in the background
  ansible.builtin.import_tasks: install-packages.yml

# Everything up to wait-for-packages.yml runs while the packages are being installed.

- name: Blacklist Longhorn block devices in multipath
  ansible.builtin.import_tasks: configure-longhorn-multipath.yml

- name: Configure node limits
  ansible.builtin.import_tasks: configure-node-limits.yml

- name: Configure the kernel for Kubernetes
  ansible.builtin.import_tasks: configure-kernel.yml

- name: Wait for the package installation
  ansible.builtin.import_tasks: wait-for-packages.yml

- name: Configure containerd and the kubelet
  ansible.builtin.import_tasks: configure-containerd-kubelet.yml
  when: not kubelet_conf.stat.exists

# A pending containerd restart has to happen before kubeadm talks to it.
- name: Apply the containerd configuration
  ansible.builtin.meta: flush_handlers
