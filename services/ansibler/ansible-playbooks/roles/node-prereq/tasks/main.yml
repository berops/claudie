---
# Puts a node into the state kubeadm expects: no swap, kernel networking for pods,
# containerd with the CRI plugin and the systemd cgroup driver, and the pinned
# Kubernetes packages. Validation is left to the kubeadm preflight checks.

- name: Turn swap off
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | default(0) | int > 0

- name: Keep swap off across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load kernel modules for container networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Load kernel modules for container networking across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Configure kernel networking for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables

# The repositories match the ones added by install-packages.yml (same file names and keys),
# so that they are not duplicated when both playbooks ran on the node.
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download apt repository keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.name }}.asc"
    mode: "0644"
  loop:
    - name: kubernetes
      url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_major_minor }}/deb/Release.key"
    - name: docker
      url: https://download.docker.com/linux/ubuntu/gpg
  retries: 2
  delay: 10

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_major_minor }}/deb/ /"
    filename: kubernetes
    update_cache: false
  register: kubernetes_repo

- name: Add Docker apt repository (containerd.io)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
    filename: docker
    update_cache: false
  register: docker_repo

- name: Install containerd and Kubernetes packages
  ansible.builtin.apt:
    name:
      - containerd.io
      - "kubelet={{ kubernetes_version }}-*"
      - "kubeadm={{ kubernetes_version }}-*"
      - "kubectl={{ kubernetes_version }}-*"
      - kubernetes-cni
      - cri-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    lock_timeout: 600
  retries: 2
  delay: 10

# Unattended upgrades must not move the cluster to a new patch behind our back.
- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

# The containerd.io package ships a config that disables the CRI plugin, and the default
# config uses the cgroupfs driver while the kubelet is configured with the systemd driver.
- name: Render the default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Write the containerd configuration
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    mode: "0644"
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

# A pending containerd restart has to happen before kubeadm talks to it.
- name: Apply the containerd configuration
  ansible.builtin.meta: flush_handlers

# kubeadm starts the kubelet itself, it only has to come back after a reboot.
- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
