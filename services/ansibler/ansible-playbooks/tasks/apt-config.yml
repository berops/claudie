---
# This playbook does two thing:
#   1. stop, configures and defers unattended upgrades
#     unattended-upgrades is started by apt-daily-upgrade.timer (apt-daily.timer runs "apt-get update").
#     The stock timers use Persistent=true, so if the VM was off at the scheduled time they fire right
#     after boot (plus RandomizedDelaySec). The upgrade then holds the dpkg lock while Claudie
#     (e.g. kubeone in kube-eleven) runs apt-get, which fails.
#
#     Not every provider supports cloud-init, so the upgrade can not be prevented before boot. Instead:
#       1. make apt wait for the dpkg lock instead of failing,
#       2. if apt maintenance is running, shut it down gracefully,
#       3. postpone the timers, so that they run 1-3h after boot instead of right after boot.
#
#     This runs on every reconciliation, which is roughly every 30 minutes on an idle cluster.
#     Steps 2 and 3 only run when the timer drop-in changes, as every timer restart postpones the next run.
#   2. disables unnecessary APT hooks
#      Ubuntu runs scripts after every `apt-get update` (APT::Update::Post-Invoke-Success)
#      and after every dpkg run (DPkg::Post-Invoke). Only two of them do something a node needs:
#      needrestart restarts services with replaced libraries after unattended upgrades, and the
#      update-success-stamp touch records the last `apt-get update` for the apt tooling. The rest is
#      cosmetic and some of it expensive.


- name: Configure apt
  vars:
    apt_claudie_conf: |
      // Managed by Claudie, see services/ansibler/ansible-playbooks/tasks/apt-config.yml.
      // Wait up to 10 minutes for the dpkg lock instead of failing immediately.
      DPkg::Lock::Timeout "600";
      // No package description translations on `apt-get update`.
      Acquire::Languages "none";
    apt_hooks_to_remove:
      - /etc/apt/apt.conf.d/99update-notifier
      - /etc/apt/apt.conf.d/50command-not-found
      - /etc/apt/apt.conf.d/20apt-esm-hook.conf
      - /etc/apt/apt.conf.d/20packagekit
    apt_daily_timers:
      - apt-daily.timer
      - apt-daily-upgrade.timer
    apt_daily_dropin: |
      # Managed by Claudie: run apt maintenance 1-3h after boot instead of right after boot.
      [Timer]
      OnCalendar=
      Persistent=false
      OnActiveSec=1h
      OnUnitActiveSec=1d
      RandomizedDelaySec=2h
  block:
    # 1. Wait for the dpkg lock.

    # Postponing the timers only covers the time right after boot. Later they fire once a day at a random
    # time, so an apt-get run by Claudie (e.g. kubeone during a Kubernetes upgrade) can still find the dpkg
    # lock held. The default DPkg::Lock::Timeout is 0, which makes apt-get fail immediately with exit code 100.
    # With a timeout, every apt-get (including kubeone's) waits until the lock is released instead.
    - name: Create apt configuration directory
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d
        state: directory
        mode: "0755"

    - name: Configure apt
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/zzz-claudie.conf
        mode: "0644"
        content: "{{ apt_claudie_conf }}"

    - name: Remove the unnecessary apt hooks
      ansible.builtin.shell: |
        for f in {{ apt_hooks_to_remove | join(' ') }}; do
          if [ -e "$f" ]; then
            rm -f "$f"
            echo "removed $f"
          fi
        done
      register: apt_hooks_removed
      changed_when: apt_hooks_removed.stdout != ""

    - name: Disable the man-db index update trigger
      ansible.builtin.shell: |
        set -e
        echo "man-db man-db/auto-update boolean false" | debconf-set-selections
        if [ -e /var/lib/man-db/auto-update ]; then
          rm -f /var/lib/man-db/auto-update
          echo changed
        fi
      register: man_db_trigger
      changed_when: "'changed' in man_db_trigger.stdout"

    - name: Check if apt daily timers are present
      ansible.builtin.stat:
        path: /lib/systemd/system/apt-daily-upgrade.timer
      register: apt_daily_upgrade_timer

    - name: Gracefully stop apt maintenance and postpone it
      when: apt_daily_upgrade_timer.stat.exists
      block:
        - name: Create drop-in directories for apt daily timers
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ item }}.d"
            state: directory
            mode: "0755"
          loop: "{{ apt_daily_timers }}"

        - name: Check if apt daily timer drop-ins are up to date
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item }}.d/zzz-claudie.conf"
            mode: "0644"
            content: "{{ apt_daily_dropin }}"
          loop: "{{ apt_daily_timers }}"
          check_mode: true
          register: apt_daily_dropins_check

        # The drop-ins are written after apt maintenance is stopped, so if a previous run failed before that,
        # they still differ and the whole block runs again.
        - name: Apply apt daily timer drop-ins
          when: apt_daily_dropins_check.changed
          block:

            # Stopping a timer does not stop an already running service, it only prevents new runs.
            - name: Stop apt daily timers
              ansible.builtin.systemd:
                name: "{{ item }}"
                state: stopped
              loop: "{{ apt_daily_timers }}"
              register: apt_daily_timers_stop

            # apt-daily.service only runs "apt-get update", which is safe to interrupt, stop waits until all its processes exit.
            # apt-daily-upgrade.service has KillMode=process, stop only sends SIGTERM to its main process.
            - name: Stop apt daily services
              ansible.builtin.systemd:
                name: "{{ item }}"
                state: stopped
              loop:
                - apt-daily.service
                - apt-daily-upgrade.service

            # unattended-upgrade-shutdown is the helper unattended-upgrades uses on shutdown. If unattended-upgrade
            # is running it sends it SIGTERM and waits until it exits, otherwise it exits immediately.
            # unattended-upgrade never interrupts a running dpkg: with Unattended-Upgrade::MinimalSteps "true"
            # (Ubuntu default) it exits after the current package, with "false" the upgrade is a single step and
            # has to finish. Its locks are released when it exits. The helper gives up after --delay minutes.

            # Once unattended-upgrade exits, the leftover apt.systemd.daily finishes on its own. The task is
            # retried until it is gone too, which also catches an unattended-upgrade started by the leftover
            # apt.systemd.daily after a previous helper run found nothing to stop. It runs unattended-upgrade
            # at most once, so the helper waits for an upgrade at most once.
            #
            # Exit codes: 0 = nothing is running, 1 = only apt.systemd.daily is running (retried),
            # 2 = the helper gave up while unattended-upgrade is still running (not retried).
            - name: Gracefully stop unattended-upgrade and wait until no apt daily process is running
              ansible.builtin.shell: |
                if [ -x /usr/share/unattended-upgrades/unattended-upgrade-shutdown ]; then
                  /usr/share/unattended-upgrades/unattended-upgrade-shutdown --stop-only --delay 20
                fi
                # The helper only returns while unattended-upgrade is running if it gave up after --delay minutes.
                # -x also matches scripts by their path, e.g. "/usr/bin/python3 /usr/bin/unattended-upgrade".
                if pidof -x /usr/bin/unattended-upgrade; then
                  exit 2
                fi
                if pidof -x /usr/lib/apt/apt.systemd.daily; then
                  exit 1
                fi
              register: apt_daily_stop
              until: apt_daily_stop.rc != 1
              retries: 6
              delay: 10
              failed_when: apt_daily_stop.rc != 0
              changed_when: false

            # Postpone apt maintenance to 1-3h after boot.

            - name: Write apt daily timer drop-ins
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item }}.d/zzz-claudie.conf"
                mode: "0644"
                content: "{{ apt_daily_dropin }}"
              loop: "{{ apt_daily_timers }}"

            - name: Reload systemd configuration
              ansible.builtin.systemd:
                daemon_reload: true

            - name: Start apt daily timers
              ansible.builtin.systemd:
                name: "{{ item.item }}"
                state: started
              loop: "{{ apt_daily_timers_stop.results }}"
              loop_control:
                label: "{{ item.item }}"
              when: item.status.UnitFileState | default('') in ['enabled', 'enabled-runtime', 'alias', 'static', 'indirect', 'generated', 'transient']

        # Previous Claudie versions masked unattended-upgrades.service. It does not run upgrades, it only
        # gracefully stops a running upgrade on shutdown, so it is unmasked again.
        - name: Enable unattended-upgrades shutdown guard
          ansible.builtin.systemd:
            name: unattended-upgrades.service
            masked: false
            enabled: true
            state: started
          failed_when: false

  # A failure must not abort the playbook
  rescue:
    - name: Warn that apt could not be configured
      ansible.builtin.debug:
        msg: "Failed to defer apt maintenance / speed up apt, continuing: {{ ansible_failed_result.msg | default('unknown error') }}"

    # If the drop-ins were already written, the next run would skip the block and leave the stopped timers
    # stopped. Removing them makes the next run apply the whole block again.
    - name: Remove apt daily timer drop-ins to retry on the next run
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d/zzz-claudie.conf"
        state: absent
      loop: "{{ apt_daily_timers }}"
      when: apt_daily_dropins_check.changed | default(false)
      failed_when: false
