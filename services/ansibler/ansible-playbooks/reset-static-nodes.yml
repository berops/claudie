---
# Removes Kubernetes from static nodes: all nodes of a destroyed cluster (RESET_STATIC_NODES stage) or
# the nodes deleted from a running cluster (REMOVE_CLAUDIE_UTILITIES stage). The ansibler passes
# only the static nodes in the inventory generated from templates/k8s-inventory.goini, the dynamic
# nodes are destroyed with their infrastructure. WireGuard and the rest of the Claudie utilities
# are removed afterwards by wireguard-uninstall.yml.
- name: Reset the nodes and remove the node requirements
  hosts: all
  become: true
  gather_facts: false
  strategy: mitogen_free
  roles:
    # The reset needs the kubeadm binary removed by node-prereq-remove.
    - kubeadm_reset
    - node-prereq-remove
