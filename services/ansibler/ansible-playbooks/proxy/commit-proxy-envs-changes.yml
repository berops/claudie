- hosts: control
  gather_facts: false
  become: true
  vars_files:
    - ../vars/k8s.yaml
  tasks:
    - name: Reset ssh connection to allow changes to environment to affect 'current login user'
      # This playbook works with modified environment variables so kill any SSH connections that are
      # reused and force a new connection to be established.
      ansible.builtin.meta: reset_connection

    - name: Read the ClusterConfiguration of the cluster
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf --server https://{{ node_ip }}:{{ api_server_port }}
          --namespace kube-system get configmap kubeadm-config --output jsonpath={.data.ClusterConfiguration}
      register: kubeadm_cluster_configuration
      changed_when: false

    # kubeadm copies the proxy envs of its own process (the new login environment, see the reset
    # above) into the static pod manifests, the kubelet restarts the pods whose manifest changed.
    # The InitConfiguration sets the advertise address as in roles/kubeadm_init and roles/kubeadm_join.
    - name: Update NO_PROXY and no_proxy in static pods /etc/kubernetes/manifests
      ansible.builtin.command:
        cmd: kubeadm init phase control-plane all --config /dev/stdin
        stdin: |
          apiVersion: {{ (kubeadm_cluster_configuration.stdout | from_yaml).apiVersion }}
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: {{ node_ip }}
            bindPort: {{ api_server_port }}
          nodeRegistration:
            name: {{ inventory_hostname }}
          ---
          {{ kubeadm_cluster_configuration.stdout }}

- hosts: all
  gather_facts: false
  become: true
  tasks:
    # This will reload the systemd unit files present under /etc/systemd/system/.
    - name: Daemon reload
      ansible.builtin.shell: |
        systemctl daemon-reload

    - name: Check if services exist
      command: systemctl is-active {{ item }}
      register: service_status
      ignore_errors: yes
      loop:
        - docker
        - containerd
        - kubelet

    - name: Restart services that are active
      ansible.builtin.service:
        name: "{{ item.item }}"
        state: restarted
      when: item.rc == 0
      loop: "{{ service_status.results }}"

- hosts: control
  gather_facts: false
  become: true
  tasks:
    - name: Try 10 times to check kube-apiserver health
      ansible.builtin.uri:
        url: "https://localhost:6443/readyz"
        method: GET
        return_content: yes
        validate_certs: no
        status_code:
          - 200
      register: api_response
      retries: 10
      delay: 10
      until: api_response.status == 200
