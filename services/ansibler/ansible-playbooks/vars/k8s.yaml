---
# Variables shared by the plays of create-cluster.yml.
# kubernetes_version is passed by the ansibler as an extra var without the "v" prefix, e.g. 1.35.0.

# The apt repository is per minor version (v1.35), the packages are pinned to the patch version.
kubernetes_major_minor: "{{ kubernetes_version.split('.')[:2] | join('.') }}"

# init_control_node, the inventory hostname of the control node running kubeadm init,
# is always passed by the ansibler (task_create_cluster.go).
# WireGuard IP of the current host, from the generated inventory.
node_ip: "{{ private_ip }}"
api_server_port: 6443
# Public IP of the init node. With an api loadbalancer, the ansibler
# overrides it with the DNS hostname of the loadbalancer.
control_plane_endpoint: "{{ hostvars[init_control_node].ansible_host }}:{{ api_server_port }}"

# Same ranges as the clusters built by kubeone, so that both kinds of clusters look alike.
pod_subnet: 10.244.0.0/16
service_subnet: 10.96.0.0/12

# Link-local IP of the NodeLocal DNSCache deployed by kuber (task_deploy_addons.go), the kubelets
# hand it to pods as their DNS server. Must match nodeLocalDNSIP in kuber. Same as kubeone.
node_local_dns_ip: 169.254.20.10
